<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Horoscope du jour</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 40px;
    font-family: Arial, sans-serif;
    background: #f5f3ef;
    color: #333;
}

header {
    text-align: center;
    margin-bottom: 20px;
}

h1 {
    margin: 0;
    font-size: 42px;
}

#date {
    margin-top: 6px;
    font-size: 22px;
    color: #666;
    text-transform: capitalize;
}

.horoscopes {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px 20px;
    max-width: 1600px;
    margin: auto;
}

.signe {
    background: white;
    border-radius: 12px;
    padding: 15px 20px;
    box-shadow: 0 2px 7px rgba(0,0,0,0.12);
}

.signe h2 {
    margin: 0 0 7px 0;
    font-size: 25px;
}

.signe p {
    margin: 0;
    font-size: 17px;
    line-height: 1.4;
}

@media (max-width: 900px) {
    .horoscopes {
        grid-template-columns: 1fr;
    }
}
</style>

</head>

<body>

<header>
    <h1>✨ Horoscope du jour ✨</h1>
    <div id="date"></div>
</header>

<div class="horoscopes" id="horoscopes"></div>

<script>

================================ */

]
},

{
nom: "Gémeaux",

]
},

{
nom: "Cancer",

"Vous avez besoin de calme et de sérénité. Accordez-vous un moment pour souffler et vous recentrer. Vous repartirez avec davantage d'énergie."
]
},

{
nom: "Lion",
symbole: "♌",
textes: [

"Vous pourriez être particulièrement remarqué aujourd'hui. Votre enthousiasme est communicatif, mais pensez également à laisser de la place aux idées des autres.",
"Une occasion de montrer vos talents pourrait se présenter. Faites-vous confiance sans chercher à tout contrôler."
]
},

{
nom: "Vierge",
symbole: "♍",
textes: [
"Votre sens de l'organisation vous permet de gagner du temps et de l'efficacité. Vous pourriez réussir à régler une situation qui vous préoccupait depuis quelque temps.",
"Vous avez envie de mettre de l'ordre dans votre quotidien. C'est une excellente journée pour terminer ce qui a été laissé de côté.",

"Votre intuition vous permet de comprendre rapidement une situation. Faites confiance à votre ressenti, tout en prenant le temps de vérifier les informations importantes.",

]
},

{

"Votre optimisme vous aide à relativiser les petits problèmes. Profitez de cette énergie positive pour partager votre bonne humeur avec votre entourage.",

{

"Vous avez aujourd'hui la possibilité de faire progresser un projet important. Votre sens des responsabilités sera un véritable atout.",
"Ne vous mettez pas trop de pression. Vous avez déjà accompli beaucoup de choses et vous pouvez vous accorder le droit de faire une pause."
]
},

{
nom: "Verseau",
symbole: "♒",
textes: [
"Votre créativité est particulièrement présente aujourd'hui. Une idée originale pourrait vous permettre de résoudre un problème d'une manière inattendue.",
"Vous avez besoin de liberté et d'espace pour exprimer vos idées. N'hésitez pas à proposer une nouvelle manière de faire les choses.",
"Une rencontre ou une conversation pourrait vous inspirer. Soyez attentif aux personnes qui croisent votre chemin aujourd'hui."
]
},

{
nom: "Poissons",
symbole: "♓",
textes: [
"Votre sensibilité vous permet de mieux comprendre les personnes qui vous entourent. Faites confiance à votre intuition, mais pensez également à protéger votre énergie.",
"Une journée propice à la détente et au recentrage. Prenez quelques minutes pour vous éloigner du rythme habituel et retrouver votre calme.",
"Une petite attention ou une bonne nouvelle pourrait illuminer votre journée. Profitez pleinement de ces moments simples qui font du bien."
]
}

];


/* ================================
   CHOIX AUTOMATIQUE DU TEXTE
   EN FONCTION DE LA DATE
================================ */

const maintenant = new Date();

const jour = maintenant.getDate();
const mois = maintenant.getMonth();
const annee = maintenant.getFullYear();

const numeroDuJour = annee * 10000 + (mois + 1) * 100 + jour;


/* ================================
   AFFICHAGE DE LA DATE
================================ */

const optionsDate = {
    weekday: 'long',
    day: 'numeric',
    month: 'long',
    year: 'numeric'
};

document.getElementById("date").textContent =
    maintenant.toLocaleDateString("fr-FR", optionsDate);


/* ================================
   AFFICHAGE DES HOROSCOPES
================================ */

const conteneur = document.getElementById("horoscopes");

signes.forEach((signe, index) => {

    const choix =
        (numeroDuJour + index * 7) % signe.textes.length;

    const horoscope = signe.textes[choix];

    const bloc = document.createElement("div");

    bloc.className = "signe";

    bloc.innerHTML = `
        <h2>${signe.symbole} ${signe.nom}</h2>
        <p>${horoscope}</p>
    `;

    conteneur.appendChild(bloc);

});

</script>

</body>
</html>
