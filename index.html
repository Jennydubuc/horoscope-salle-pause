<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Horoscope du jour</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 40px;
    font-family: Arial, sans-serif;
    background: #f5f3ef;
    color: #333;
}

header {
    text-align: center;
    margin-bottom: 20px;
}

h1 {
    margin: 0;
    font-size: 42px;
}

#date {
    margin-top: 6px;
    font-size: 22px;

    text-transform: capitalize;
}

.horoscopes {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px 20px;
    max-width: 1600px;
    margin: auto;
}

.signe {
    background: white;
    border-radius: 12px;
    padding: 15px 20px;
    box-shadow: 0 2px 7px rgba(0,0,0,0.12);
}

.signe h2 {
    margin: 0 0 7px 0;
    font-size: 25px;
}

.signe p {
    margin: 0;
    font-size: 17px;
    line-height: 1.4;
}

@media (max-width: 900px) {

    .horoscopes {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

/* =====================================================
   CALCUL ASTROLOGIQUE SIMPLIFIÉ
===================================================== */

const reference =
new Date("2025-01-01T00:00:00");


function positionPlanete(
date,
periode,
positionReference
) {

const difference =

(date - reference) /

(1000 * 60 * 60 * 24);


let position =

positionReference +

(difference / periode) * 360;


position = position % 360;


if (position < 0) {

position += 360;

}


return position;

}

===================================================== */

const positions = {};


planetes.forEach(

planete => {

===================================================== */

/* =====================================================

function genererHoroscope(

const influence =

positionMars +

positionVenus +

index

const texte =

textes[influence];


return texte.debut +

" " +

texte.fin;

}
